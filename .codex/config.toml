# Codex CLI — project configuration for One-Take.
#
# Codex reads .codex/config.toml files walking from the repo root to your cwd.
# The repo must be trusted for these to apply; some keys are not permitted at
# project scope and are silently ignored — `codex --help` and the config docs
# are authoritative over anything written here.
#
# The project spec itself is AGENTS.md, which Codex reads natively (root plus
# nested, merged). Nothing below duplicates it.

# Nine modules and an Android build: the default timeout is too tight for a
# cold `./gradlew :app:assembleDebug`.
[shell_environment_policy]
# There is no system JDK on the build machines — only Android Studio's bundled
# one. Without this, every Gradle command fails with "Unable to locate a Java
# Runtime" and the failure looks like a Gradle problem.
set = { JAVA_HOME = "/Applications/Android Studio.app/Contents/jbr/Contents/Home", ANDROID_HOME = "/Users/melvin/Library/Android/sdk" }

[projects."."]
trust_level = "trusted"
