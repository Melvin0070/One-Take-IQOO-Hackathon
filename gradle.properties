# JVM for the Gradle daemon. Bumped from 2g: nine modules, agents building in parallel.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Playbook Step 1 (commit #1). These three are why a rebuild is seconds, not minutes,
# and at a hackathon that compounds across every agent, every hour.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
